<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskGuru Prototype</title>
    <!-- Import clean Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet" />
    
    
    <style>
        body { font-family: var(--current-font, 'Segoe UI'), sans-serif; background-color: #121212; color: #ffffff; padding: 30px; transition: font-family 0.2s ease; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        /* Premium Clean App Header Bar */
        .app-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 15px; }
        h2 { margin: 0; color: #4fc3f7; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        
        /* Time & Systems Widget */
        .time-panel { display: flex; align-items: center; gap: 10px; }
        .clock-widget { font-family: 'Roboto Mono', monospace; color: #00e676; font-size: 14px; font-weight: bold; cursor: pointer; background: #252525; padding: 6px 10px; border-radius: 4px; border: 1px solid #333; }
        .analog-clock-icon { width: 30px; height: 30px; cursor: pointer; background: #252525; border-radius: 50%; border: 1px solid #4fc3f7; }
        
        /* Customization Controls Deck */
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: #252525; padding: 12px; border-radius: 6px; }
        .selectors-row { display: flex; gap: 10px; width: 100%; }
        select { flex: 1; padding: 8px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .emojis-row { display: flex; gap: 8px; justify-content: flex-start; margin-top: 2px; }
        .emoji-btn { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 16px; flex: 1; text-align: center; }
        
        /* Integrated Alarm & Scheduling Deck */
        .alarm-settings { display: flex; flex-direction: column; gap: 8px; background: #252525; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; color: #aaa; }
        .settings-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        .alarm-settings input[type="time"], .alarm-settings input[type="date"] { background: #333; color: white; border: none; padding: 6px; border-radius: 4px; font-family: 'Roboto Mono', monospace; flex: 1; }
        .alarm-active-badge { display: none; color: #ffb300; font-weight: bold; font-size: 12px; animation: pulse 1.5s infinite; text-align: center; width: 100%; margin-top: 4px; }

        /* Pull-Down Calendar Overlay Drawer */
        .calendar-drawer { display: none; background: #252525; border: 1px solid #4fc3f7; padding: 15px; border-radius: 6px; margin-bottom: 15px; text-align: center; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; font-size: 12px; }
        .calendar-day-header { font-weight: bold; color: #4fc3f7; }
        .calendar-day { padding: 6px; background: #1e1e1e; border-radius: 3px; cursor: pointer; }
        .calendar-day:hover { background: #333; }
        .current-day { background: #00e676; color: #000; font-weight: bold; }

        /* Input & Task Card Styles */
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; background: #252525; padding: 12px; border-radius: 6px; }
        .date-pickers { display: flex; gap: 8px; width: 100%; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #2d2d2d; color: #fff; box-sizing: border-box; }
        .add-btn { width: 100%; padding: 12px 20px; background: #00e676; color: #000; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; white-space: nowrap; }
        
        /* Edit Field Actions */
        .edit-input { background: #3a3a3a; color: #fff; border: 1px solid #4fc3f7; padding: 6px; border-radius: 4px; width: 65%; font-family: inherit; font-size: 14px; }
        .action-group { display: flex; gap: 6px; }
        .edit-btn { background: #0288d1; color: white; width: auto; padding: 5px 10px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .save-btn { background: #00e676; color: black; width: auto; padding: 5px 10px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }

        h3 { color: #ff5252; margin-top: 25px; margin-bottom: 5px; font-size: 16px; }
        ul { list-style: none; padding: 0; margin-top: 10px; }
        li { background: #2a2a2a; padding: 12px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .delete-btn { background: #ff5252; color: white; width: auto; padding: 5px 10px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .time-log { font-size: 10px; color: #aaa; display: block; margin-top: 4px; }
        .trash-item { background: #2c1d1d; border-left: 4px solid #ff5252; }

        /* 📱 Smart Mobile Responsive Layout Engine Overrides */
        @media (max-width:480px){body{padding:15px}.app-header{flex-direction:column;align-items:flex-start;gap:12px}.time-panel{width:100%;justify-content:space-between}.selectors-row{flex-direction:column;gap:8px}.emojis-row{display:grid;grid-template-columns:repeat(4,1fr);width:100%}.settings-row{flex-direction:column;align-items:flex-start;gap:6px}.alarm-settings input[type="time"],.alarm-settings input[type="date"]{width:100%}.date-pickers{flex-direction:column;gap:6px}}
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>

	// 1. Unified Real-Time Clock & Dynamic Pre-Dated Alert Processor
    function runClockEcosystem() {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString();

        const secs = now.getSeconds();
        const mins = now.getMinutes();
        const hrs = now.getHours();

        document.getElementById('secondHand').setAttribute('transform', 'rotate(' + (secs * 6) + ' 50 50)');
        document.getElementById('minuteHand').setAttribute('transform', 'rotate(' + ((mins * 6) + (secs * 0.1)) + ' 50 50)');
        document.getElementById('hourHand').setAttribute('transform', 'rotate(' + ((hrs * 30) + (mins * 0.5)) + ' 50 50)');

        evaluateTaskAlertBoundaries(now.getTime());
    }

    function evaluateTaskAlertBoundaries(currentTimestampMs) {
        let displayNotice = false;

        tasks.forEach(task => {
            if (task.status === "active" && task.alertTimestamp) {
                const bufferWindowMs = parseInt(task.noticeWindowHours, 10) * 60 * 60 * 1000;
                const activeTriggerTargetTime = task.alertTimestamp - bufferWindowMs;

                if (currentTimestampMs >= activeTriggerTargetTime && currentTimestampMs < task.alertTimestamp) {
                    displayNotice = true;
                }
            }
        });

        const badge = document.getElementById('alertNoticeBadge');
        if (displayNotice) {
            badge.style.display = 'block';
            badge.innerText = localizationDictionary[currentLang].noticeTriggered;
        } else {
            badge.style.display = 'none';
        }
    }

    // 2. Interactive Calendar Drawer Rendering
    function toggleCalendar() {
        const drawer = document.getElementById('calendarDrawer');
        drawer.style.display = (drawer.style.display === "block") ? "none" : "block";
        if (drawer.style.display === "block") generateCalendarGrid();
    }

    function generateCalendarGrid() {
        const grid = document.getElementById('calendarGrid');
        const monthYearHeader = document.getElementById('calendarMonthYear');
        grid.innerHTML = '';

        const now = new Date();
        const currentDay = now.getDate();
        
        ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach(day => {
            const h = document.createElement('div');
            h.className = 'calendar-day-header';
            h.innerText = day;
            grid.appendChild(h);
        });

        monthYearHeader.innerText = now.toLocaleString('default', { month: 'long', year: 'numeric' });
        
        for (let i = 1; i <= 30; i++) {
            const dayBox = document.createElement('div');
            dayBox.className = 'calendar-day' + (i === currentDay ? ' current-day' : '');
            dayBox.innerText = i.toString();
            dayBox.onclick = () => {
                const formatDay = i < 10 ? '0' + i : i;
                const m = now.getMonth() + 1;
                const formatMonth = m < 10 ? '0' + m : m;
                document.getElementById('taskTargetDate').value = now.getFullYear() + '-' + formatMonth + '-' + formatDay;
            };
            grid.appendChild(dayBox);
        }
    }
	    // 3. App Core Configurations & Personalization Handlers
    function changeFont(fontName) {
        document.body.style.setProperty('--current-font', fontName);
        localStorage.setItem('taskguru_font', fontName);
    }

    function loadSavedFontPreference() {
        const savedFont = localStorage.getItem('taskguru_font');
        if (savedFont) {
            document.body.style.setProperty('--current-font', savedFont);
            document.getElementById('fontSelector').value = savedFont;
        }
    }

    function changeLanguage(langCode) {
        currentLang = langCode;
        localStorage.setItem('taskguru_lang', langCode);
        
        const strings = localizationDictionary[langCode];
        document.getElementById('taskInput').placeholder = strings.placeholder;
        document.getElementById('btnAddTask').innerText = strings.addTask;
        document.getElementById('lblActiveTasks').innerText = strings.activeTasks;
        document.getElementById('lblTrashRoom').innerText = strings.trashRoom;
        
        renderTasks();
    }

    function stampEmoji(emoji) {
        const input = document.getElementById('taskInput');
        input.value = emoji + input.value;
        input.focus();
    }

    // 4. Data Layout CRUD Controls Engine (Create, Read, Update, Delete)
    function handleAddTask() {
        const input = document.getElementById('taskInput');
        const targetDate = document.getElementById('taskTargetDate').value;
        const targetTime = document.getElementById('taskTargetTime').value;
        const noticeWindow = document.getElementById('taskNoticeWindow').value;

        if (!input.value.trim()) return;

        let calculatedAlertTimestamp = null;
        if (targetDate && targetTime) {
            calculatedAlertTimestamp = new Date(targetDate + 'T' + targetTime).getTime();
        }

        const newTask = {
            id: Date.now(),
            title: input.value,
            status: "active",
            createdAt: new Date().toLocaleTimeString(),
            deletedAt: null,
            isEditing: false,
            alertTimestamp: calculatedAlertTimestamp,
            noticeWindowHours: noticeWindow
        };

        tasks.push(newTask);
        saveAndRefreshWorkspace();
        
        input.value = '';
        document.getElementById('taskTargetDate').value = '';
        document.getElementById('taskTargetTime').value = '';
    }

    function toggleEditMode(id) {
        tasks = tasks.map(t => {
            if (t.id === id) t.isEditing = !t.isEditing;
            return t;
        });
        renderTasks();
    }

    function handleSaveInlineEdit(id, updatedText, updatedDate, updatedTime) {
        if (!updatedText.trim()) return;
        
        let customNewTimestamp = null;
        if (updatedDate && updatedTime) {
            customNewTimestamp = new Date(updatedDate + 'T' + updatedTime).getTime();
        }

        tasks = tasks.map(t => {
            if (t.id === id) {
                t.title = updatedText;
                t.alertTimestamp = customNewTimestamp;
                t.isEditing = false;
            }
            return t;
        });
        saveAndRefreshWorkspace();
    }

    function handleMoveToTrash(id) {
        tasks = tasks.map(t => {
            if (t.id === id) {
                t.status = "trashed";
                t.deletedAt = new Date().getTime();
            }
            return t;
        });
        saveAndRefreshWorkspace();
    }

    function runAutoDeleteCheck() {
        const thirtyDaysInMs = 30 * 24 * 60 * 60 * 1000;
        const now = new Date().getTime();

        const cleanSet = tasks.filter(t => {
            if (t.status === "trashed" && t.deletedAt) {
                return (now - t.deletedAt) < thirtyDaysInMs;
            }
            return true;
        });

        if (cleanSet.length !== tasks.length) {
            tasks = cleanSet;
            localStorage.setItem('taskguru_tasks', JSON.stringify(tasks));
        }
    }

    function saveAndRefreshWorkspace() {
        localStorage.setItem('taskguru_tasks', JSON.stringify(tasks));
        renderTasks();
    }

    function renderTasks() {
        runAutoDeleteCheck();

        const activeContainer = document.getElementById('taskList');
        const trashContainer = document.getElementById('trashList');
        const strings = localizationDictionary[currentLang];
        
        activeContainer.innerHTML = '';
        trashContainer.innerHTML = '';

        tasks.forEach(task => {
            const li = document.createElement('li');
            
            if (task.status === "active") {
                if (task.isEditing) {
                    let currentDVal = "";
                    let currentTVal = "";
                    if (task.alertTimestamp) {
                        const dObj = new Date(task.alertTimestamp);
                        const yr = dObj.getFullYear();
                        const mo = String(dObj.getMonth() + 1).padStart(2, '0');
                        const dy = String(dObj.getDate()).padStart(2, '0');
                        const hr = String(dObj.getHours()).padStart(2, '0');
                        const mn = String(dObj.getMinutes()).padStart(2, '0');
                        currentDVal = yr + '-' + mo + '-' + dy;
                        currentTVal = hr + ':' + mn;
                    }

                    li.innerHTML = '<div style="display:flex; flex-direction:column; gap:6px; width:70%;">' +
                                   '<input type="text" class="edit-input" style="width:100%;" id="editField-' + task.id + '" value="' + task.title + '" />' +
                                   '<div style="display:flex; gap:4px;">' +
                                   '<input type="date" id="editDate-' + task.id + '" value="' + currentDVal + '" style="background:#333; color:white; border:none; padding:4px; border-radius:4px; font-size:11px;" />' +
                                   '<input type="time" id="editTime-' + task.id + '" value="' + currentTVal + '" style="background:#333; color:white; border:none; padding:4px; border-radius:4px; font-size:11px;" />' +
                                   '</div>' +
                                   '<span class="time-log">' + strings.createdLog + task.createdAt + '</span>' +
                                   '</div>' +
                                   '<div class="action-group"><button class="save-btn" onclick="handleSaveInlineEdit(' + task.id + ', document.getElementById(\'editField-\' + ' + task.id + ').value, document.getElementById(\'editDate-\' + ' + task.id + ').value, document.getElementById(\'editTime-\' + ' + task.id + ').value)">' + strings.saveBtn + '</button>' +
                                   '<button class="delete-btn" onclick="toggleEditMode(' + task.id + ')">X</button></div>';
                } else {
                    let formattedSchedule = "";
                    if (task.alertTimestamp) {
                        const sObj = new Date(task.alertTimestamp);
                        formattedSchedule = " | 📅 " + sObj.toLocaleDateString() + " " + sObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    }

                    li.innerHTML = '<div style="max-width:65%; word-break:break-word;"><strong>' + task.title + '</strong>' +
                                   '<span class="time-log">' + strings.createdLog + task.createdAt + formattedSchedule + '</span></div>' +
                                   '<div class="action-group"><button class="edit-btn" onclick="toggleEditMode(' + task.id + ')">' + strings.editBtn + '</button>' +
                                   '<button class="delete-btn" onclick="handleMoveToTrash(' + task.id + ')">' + strings.deleteBtn + '</button></div>';
                }
                activeContainer.appendChild(li);
            } else if (task.status === "trashed") {
                li.className = "trash-item";
                li.innerHTML = '<div style="max-width:100%; word-break:break-word;"><strong style="text-decoration: line-through; color: #888;">' + task.title + '</strong><span class="time-log">' + strings.trashExpiry + '</span></div>';
                trashContainer.appendChild(li);
            }
        });
    }

    // 5. Automatic PWA Background Engine Registration Setup
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js')
                .then(function(reg) {
                    console.log('TaskGuru Engine registered successfully:', reg.scope);
                })
                .catch(function(err) {
                    console.log('TaskGuru Engine registration failed:', err);
                });
        });
    }

    setInterval(runClockEcosystem, 1000);
    runClockEcosystem();
    loadSavedFontPreference();
    document.getElementById('languageSelector').value = currentLang;
    changeLanguage(currentLang);
</script>

</body>
</html>
